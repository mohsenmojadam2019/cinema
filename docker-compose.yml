services:
  app:
    build: .
    ports: ["8000:8000"]
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
      KAVENEGAR_SENDER: ${KAVENEGAR_SENDER:-}
    volumes:
      - cinema_storage:/var/www/html/storage
      - cinema_database:/var/www/html/database
    depends_on: [redis]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: ["cinema_redis:/data"]
volumes:
  cinema_storage:
  cinema_database:
  cinema_redis:
