services:
  app:
    build: .
    ports: ["8000:8000"]
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
      KAVENEGAR_SENDER: ${KAVENEGAR_SENDER:-}
    volumes:
      - cinema_storage:/var/www/html/storage
      - cinema_database:/var/www/html/database
    depends_on: [redis]
    healthcheck:
      test: ["CMD", "php", "artisan", "cinema:health"]
      interval: 30s
      timeout: 10s
      retries: 3
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
  worker:
    build: .
    command: php artisan queue:work redis --queue=notifications,default --sleep=1 --tries=3 --timeout=90
    environment:
      APP_ENV: production
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
    volumes:
      - cinema_storage:/var/www/html/storage
      - cinema_database:/var/www/html/database
    depends_on: [redis, app]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: ["cinema_redis:/data"]
volumes:
  cinema_storage:
  cinema_database:
  cinema_redis:
